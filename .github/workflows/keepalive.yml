# Gọi nhẹ Supabase mỗi 3 ngày để dự án gói Free không bị tạm dừng khi học viên nghỉ lâu.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 2 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" -X POST "https://iyhxpcsoyyjcnllrsufz.supabase.co/rest/v1/rpc/check_join_code" \
            -H "apikey: sb_publishable_JOislSlr6yDYvz3BIFNtjQ_u-3OCdxr" -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}'
